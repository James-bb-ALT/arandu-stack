[package]
name = "release-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
name = "release_eval"
path = "src/lib.rs"

[[bin]]
name = "release-evaluate"
path = "src/bin/release-evaluate.rs"

[dependencies]
ha-catalog = { path = "../ha-catalog" }
nlu-core = { path = "../nlu-core" }
nlu-data = { path = "../nlu-data" }
nlu-server = { path = "../nlu-server" }
policy-engine = { path = "../policy-engine" }
protocol = { path = "../protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
session-engine = { path = "../session-engine" }
unicode-segmentation = "=1.13.3"
