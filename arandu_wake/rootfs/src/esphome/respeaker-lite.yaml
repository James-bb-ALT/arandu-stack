# CANDIDATO: XIAO ESP32S3 + ReSpeaker Lite XMOS I2S 48 kHz v1.1.0.
# Não identificado no hardware do usuário. Não fazer upload antes do checklist.
# Pinos/canais: formatBCE/Respeaker-Lite-ESPHome-integration
# commit 4282ef33ebd87080ca922412d9dda55eadf32169, config/common/.
# Este arquivo NÃO inclui firmware XMOS nem ação de auto-DFU/factory reset.
substitutions:
  device_name: arandu-respeaker-lite
  friendly_name: Arandu ReSpeaker Lite

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  on_shutdown:
    then:
      - lambda: id(respeaker).mute_speaker();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  on_disconnect:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_connect:
    - script.execute: reconcile_listening

logger:
  level: INFO
  baud_rate: 0
  logs:
    voice_assistant: WARN
    micro_wake_word: WARN

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    encryption:

external_components:
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: 04a9f40154d2720bd90745f025f6a6deb50f5681
    components: [i2s_audio]
    refresh: never
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration
      ref: 4282ef33ebd87080ca922412d9dda55eadf32169
    components: [respeaker_lite]
    refresh: never

i2c:
  id: internal_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO44
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: stereo
    i2s_mode: secondary

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

speaker:
  - platform: i2s_audio
    id: hardware_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO43
    dac_type: external
    audio_dac: aic3204_dac
    i2s_mode: secondary
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: stereo
    buffer_duration: 100ms
    timeout: never
  - platform: resampler
    id: response_speaker
    output_speaker: hardware_speaker
    sample_rate: 48000
    bits_per_sample: 16

respeaker_lite:
  id: respeaker
  i2c_id: internal_i2c
  reset_pin: GPIO2
  mute_state:
    id: hardware_muted
    name: Hardware microphone muted
    on_state:
      - script.execute: reconcile_listening
  firmware_version:
    id: xmos_version
    name: XMOS firmware version
    on_value:
      - script.execute: reconcile_listening

globals:
  - id: wake_started_ms
    type: uint32_t
    initial_value: '0'
  - id: busy
    type: bool
    initial_value: 'false'
  - id: response_playing
    type: bool
    initial_value: 'false'

switch:
  - platform: template
    id: software_muted
    name: Microphone privacy mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: reconcile_listening
    on_turn_off:
      - script.execute: reconcile_listening

select:
  - platform: template
    id: detection_mode
    name: Wake detection mode
    optimistic: true
    restore_value: true
    initial_option: Home Assistant
    options: [Home Assistant, microWakeWord]
    on_value:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - delay: 500ms
      - script.execute: reconcile_listening

number:
  - platform: template
    name: Alexa local probability cutoff
    id: alexa_cutoff
    entity_category: config
    min_value: 0.50
    max_value: 0.99
    step: 0.01
    initial_value: 0.90
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(alexa).set_probability_cutoff(static_cast<uint8_t>(x * 255));

binary_sensor:
  - platform: status
    name: Connection
  - platform: template
    name: Session active
    lambda: return id(busy);
  - platform: template
    name: Listening
    lambda: |-
      return !id(busy) && !id(software_muted).state &&
        id(hardware_muted).has_state() && !id(hardware_muted).state &&
        (id(va).get_api_connection() != nullptr) && (id(va).is_running() || id(mww).is_running());
  # D2/GPIO3 só funciona se jumper/botão soldado como na documentação Seeed.
  - platform: gpio
    id: user_button
    name: User button
    pin:
      number: GPIO3
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
          else:
            - if:
                condition:
                  lambda: |-
                    return !id(software_muted).state && id(hardware_muted).has_state() &&
                      !id(hardware_muted).state && !id(busy) && !id(response_playing) &&
                      id(xmos_version).state == "1.1.0" && (id(va).get_api_connection() != nullptr);
                then:
                  - micro_wake_word.stop:
                  - voice_assistant.start:

sensor:
  - platform: debug
    free:
      name: Free heap
    min_free:
      name: Minimum free heap
    psram:
      name: Free PSRAM
    loop_time:
      name: Maximum loop time
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: template
    id: interaction_ms
    name: Last interaction duration
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: never

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: true
  models:
    - id: alexa
      model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/alexa.json
      probability_cutoff: 0.90
  on_wake_word_detected:
    - if:
        condition:
          lambda: |-
            return id(detection_mode).current_option() == "microWakeWord" &&
              !id(software_muted).state && id(hardware_muted).has_state() &&
              !id(hardware_muted).state && !id(busy) && !id(response_playing) &&
              !id(va).is_running() && (id(va).get_api_connection() != nullptr);
        then:
          - lambda: id(wake_started_ms) = millis();
          - logger.log:
              format: "Alexa detected locally"
              level: INFO
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: i2s_mics
    channels: 0
  speaker: response_speaker
  micro_wake_word: mww
  use_wake_word: true
  noise_suppression_level: 0
  auto_gain: 0dBFS
  volume_multiplier: 1
  on_client_connected:
    - delay: 5s
    - script.execute: reconcile_listening
  on_client_disconnected:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - lambda: |-
        id(busy) = false;
        id(response_playing) = false;
  on_wake_word_detected:
    - lambda: |-
        id(wake_started_ms) = millis();
        id(busy) = true;
    - logger.log:
        format: "Alexa detected by Home Assistant"
        level: INFO
  on_start:
    - micro_wake_word.stop:
    - lambda: |-
        // Central mode starts the pipeline BEFORE wake detection.
        if (id(detection_mode).current_option() == "microWakeWord") id(busy) = true;
  on_stt_vad_start:
    - lambda: id(busy) = true;
  on_tts_stream_start:
    - lambda: id(response_playing) = true;
  on_tts_stream_end:
    - lambda: id(response_playing) = false;
  on_end:
    - lambda: |-
        if (id(wake_started_ms) != 0) {
          id(interaction_ms).publish_state(millis() - id(wake_started_ms));
          id(wake_started_ms) = 0;
        }
        id(busy) = false;
        id(response_playing) = false;
    - delay: 750ms
    - script.execute: reconcile_listening
  on_error:
    - lambda: |-
        id(busy) = false;
        id(response_playing) = false;
        ESP_LOGW("arandu_wake", "Voice error: %s", code.c_str());
    - delay: 2s
    - script.execute: reconcile_listening

script:
  - id: reconcile_listening
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(software_muted).state || !id(hardware_muted).has_state() ||
                id(hardware_muted).state || !(id(va).get_api_connection() != nullptr) ||
                id(xmos_version).state != "1.1.0";
          then:
            - micro_wake_word.stop:
            - voice_assistant.stop:
          else:
            - if:
                condition:
                  lambda: return !id(busy) && !id(response_playing) && !id(va).is_running();
                then:
                  - if:
                      condition:
                        lambda: return id(detection_mode).current_option() == "Home Assistant";
                      then:
                        - micro_wake_word.stop:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
                      else:
                        - lambda: id(va).set_use_wake_word(false);
                        - if:
                            condition:
                              not:
                                micro_wake_word.is_running:
                            then:
                              - micro_wake_word.start:

interval:
  # Some pipeline errors stop start_continuous; recover without a second session.
  - interval: 10s
    then:
      - script.execute: reconcile_listening

debug:
  update_interval: 30s
