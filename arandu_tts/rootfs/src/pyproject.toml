[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "arandu-tts"
version = "0.2.0"
description = "TTS PT-BR para Home Assistant: Piper + Pocket + comparação web e clonagem de voz"
requires-python = ">=3.11"
authors = [{name = "Arandu Community"}]
license = {text = "GPL-3.0-or-later"}
dependencies = ["piper-tts==1.8.0", "wyoming==1.10.2", "aiohttp>=3.10,<4"]

[project.optional-dependencies]
pocket = ["pocket-tts==3.3.0", "numpy>=1.26"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
gpu = ["omnivoice", "numpy", "scipy", "soundfile", "torch"]

[project.scripts]
arandu-tts = "arandu_tts.server:main"
arandu-gpu = "arandu_tts.gpu_server:main"

[tool.setuptools.packages.find]
include = ["arandu_tts*"]

[tool.setuptools.package-data]
arandu_tts = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
