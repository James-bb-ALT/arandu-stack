[package]
name = "local-nlu"
version = "0.5.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "local_nlu"

[[bin]]
name = "local-nlu"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
unicode-normalization = "=0.1.25"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
