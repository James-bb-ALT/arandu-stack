name: Arandu STT
version: "4.0.2"
slug: arandu_stt
description: "STT local multimodelo com correção contextual, Wyoming, captura limitada e métricas de áudio"
arch:
  - amd64
init: false
startup: application
boot: auto
stage: experimental
discovery:
  - wyoming
ports:
  "10350/tcp": null
ports_description:
  "10350/tcp": Wyoming STT (opcional para acesso externo)
homeassistant_api: true
homeassistant: "2026.2.0"
backup_exclude:
  - "models*"
  - "hub*"
options:
  stt_model: orukeet_int8
  whisper_profile: normalize_only
  auto_download: false
  model_variant: adapted
  threads: 2
  max_clients: 16
  padding_ms: 0
  profile: full
  debug_text: false
  refresh_inventory: true
  lexical_enabled: true
  closed_vocabulary: true
  generic_weight: 7
  home_assistant_weight: 10
  inventory_refresh_seconds: 60
schema:
  stt_model: "list(fastconformer|whisper_tiny|whisper_base|whisper_small|parakeet_ptbr_30s|parakeet_tagarela|orukeet_int8|granite_turboctc_q4)"
  whisper_profile: "list(raw|normalize_only|full)"
  auto_download: bool
  model_variant: "list(adapted|original)"
  threads: "int(1,4)"
  max_clients: "int(1,32)"
  padding_ms: "list(0|100|200|300)"
  profile: "list(raw|normalize_only|acoustic_only|fuzzy_only|inventory_only|full|legacy_full)"
  debug_text: bool
  refresh_inventory: bool
  lexical_enabled: bool
  closed_vocabulary: bool
  generic_weight: "int(0,100)"
  home_assistant_weight: "int(0,100)"
  inventory_refresh_seconds: "int(0,86400)"
