name: Testes
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio aiohttp numpy pyyaml
      - run: python -m compileall -q arandu_tts tools
      - run: python -m pytest -q
      - run: python tools/sync_addon.py && git diff --exit-code addon/app
